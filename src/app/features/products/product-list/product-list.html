<h1 class="product-list__title">Todos los productos</h1>

<div class="product-list__filters">
    <button class="product-list__filter" type="button">Verduras</button>
    <button class="product-list__filter" type="button">Frutas</button>
    <button class="product-list__filter" type="button">Zumos</button>
</div>

<h2 class="product-list__count">{{ products().length }} resultados de productos</h2>

<div class="product-list__grid">
    @for (product of products(); track product.id) {
        <app-product-card [product]="product"></app-product-card>
    }
</div>
