<h1 class="product-list__title">Todos los productos</h1>

<div class="product-list__filters">
    @for (category of categories; track category.value) {
        <button
            class="product-list__filter"
            [class.product-list__filter--active]="selectedCategory() === category.value"
            [attr.aria-pressed]="selectedCategory() === category.value"
            type="button"
            (click)="toggleCategory(category.value)"
        >
            {{ category.label }}
        </button>
    }
</div>

<h2 class="product-list__count">{{ filteredProducts().length }} resultados de productos</h2>

<div class="product-list__grid">
    @for (product of filteredProducts(); track product.id) {
        <app-product-card [product]="product"></app-product-card>
    }
</div>
