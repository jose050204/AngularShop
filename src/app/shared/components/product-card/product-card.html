<article class="product-card">
    <img class="product-card__image" [src]="product().image" [alt]="product().name" >
    <h3 class="product-card__name">{{ product().name }}</h3>
    <p class="product-card__price">{{ product().price }}€ (con IVA)</p>
    <button class="button button--brown product-card__button" type="button">Añadir a la cesta</button>
</article>
